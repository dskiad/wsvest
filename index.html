<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Widows Sons Vest Configurator</title>
  <meta name="description" content="Configure the Chapter Hellas vest rank, Roadname, Honorary and Founder patches.">
  <style>
    :root{color-scheme:dark;--silver:#e7e9ed;--line:#363b44;--muted:#989fa9}
    *{box-sizing:border-box}
    body{margin:0;background:#08090b;color:#f4f5f7;font-family:Inter,Segoe UI,Arial,sans-serif}
    .app{min-height:100vh;display:grid;grid-template-columns:minmax(300px,360px) 1fr}
    aside{padding:28px;background:linear-gradient(155deg,#181a20,#0b0c0f 70%);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;box-shadow:24px 0 70px #0008;z-index:2}
    .brand{display:flex;align-items:center;gap:14px}
    .seal{width:54px;height:54px;border:2px solid #d6dae0;border-radius:50%;display:grid;place-items:center;font:bold 19px Georgia;background:radial-gradient(circle at 35% 25%,#525862,#101216 64%);box-shadow:0 0 0 5px #fff1}
    .eyebrow{margin:0 0 4px;color:#aeb4bd;font-size:12px;font-weight:800;letter-spacing:.2em}
    h1,h2{margin:0;font-family:Georgia,serif;font-weight:500} h1{font-size:28px} h2{font-size:27px}
    .field{display:grid;gap:10px}.field label,.toggle label{font-size:19px;font-weight:900;letter-spacing:.045em;line-height:1.2;color:#eef2f7;text-shadow:0 1px 0 #fff,0 2px 5px rgba(185,196,211,.35)}
    select,input{width:100%;height:46px;padding:0 13px;border:1px solid #3c424c;border-radius:10px;background:#17191e;color:#f5f6f8;font:15px inherit;outline:none}
    select:focus,input:focus{border-color:#c4c9d0;box-shadow:0 0 0 3px #d8dde31f}
    .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.help{margin:0;color:var(--muted);font-size:12px}
    .toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border:1px solid #30343d;border-radius:12px;background:#14161a}
    .toggle-copy{display:grid;gap:3px}.toggle-copy small{color:var(--muted)}
    .switch{position:relative;width:46px;height:25px;border:0;border-radius:99px;background:#3b4049;cursor:pointer;transition:.2s}
    .switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#d6d9de;transition:.2s}
    .switch.on{background:#daddE2}.switch.on::after{left:24px;background:#111318}
    .subfield{margin-top:-12px;padding-left:14px;border-left:2px solid #454a54}
    .silver-note{margin:0;color:#d7dbe1;font-size:12px;display:flex;align-items:center;gap:7px}.silver-note::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 9px #fff}
    .specs{margin-top:auto;padding:15px;border:1px solid #30343d;border-radius:13px;background:#0b0c0f;display:grid;gap:9px}
    .specs div{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.specs strong{color:#e6e8ec}
    main{min-width:0;padding:25px 36px;background:radial-gradient(circle at 55% 35%,#262a32,#111318 45%,#08090b 78%)}
    header{max-width:860px;margin:auto;display:flex;justify-content:space-between;align-items:center}.badge{padding:8px 12px;border:1px solid #3a3f48;border-radius:99px;color:#969da7;background:#101216;font-size:13px}.badge.active{color:#fff;border-color:#b7bdc6;box-shadow:0 0 20px #fff2}
    .stage{min-height:calc(100vh - 90px);display:grid;place-items:center}
    .vest{position:relative;width:min(690px,76vh,calc(100vw - 430px));aspect-ratio:3/4;filter:drop-shadow(0 28px 32px #000a)}
    .vest>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .patch{position:absolute;z-index:3;height:5.4%;width:20.8%;display:flex;align-items:center;justify-content:center;padding:0 4%;overflow:hidden;white-space:nowrap;border:2px solid #e5e8ec;outline:1px solid #686e77;border-radius:4px;background:linear-gradient(#191b1f,#020304 55%,#101215);box-shadow:inset 0 0 0 2px #07080a,inset 0 0 0 3px #aeb4bc,0 3px 6px #000b;color:#eef0f3;text-shadow:0 1px #fff7,0 3px 3px #000;font:bold clamp(8px,1.25vw,17px) Georgia,serif}
    .rank{left:20.2%;top:34.9%;font-size:clamp(7px,1.05vw,14px)}.road{left:20.2%;top:40.35%}.honorary{left:20.2%;top:45.8%;font-size:clamp(7px,1.02vw,14px)}.founder{left:59.8%;top:44.8%}
    .size{position:absolute;z-index:4;top:8.4%;left:47%;padding:4px 8px;border:1px solid #555b64;background:#101216;color:#e9ebee;text-align:center;font-size:clamp(6px,.65vw,10px);line-height:1.15}.size strong{display:block;font-size:1.55em}
    .hidden{display:none}
    @media(max-width:900px){.app{grid-template-columns:1fr}aside{min-height:auto;border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.brand,.specs{grid-column:1/-1}main{padding:24px 10px}.stage{min-height:auto}.vest{width:min(680px,96vw)}}
    @media(max-width:560px){aside{grid-template-columns:1fr;padding:22px}.brand,.specs{grid-column:auto}header{padding:0 6px}.patch{border-width:1px}.vest{width:100%}}
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><div class="seal">WS</div><div><p class="eyebrow">CHAPTER HELLAS</p><h1>Vest Configurator</h1></div></div>
      <div class="field">
        <label for="rank">Office Rank</label>
        <select id="rank">
          <option>President</option><option>Grand Master</option><option>Vice President</option><option>Secretary</option><option>Treasurer</option><option>Sergeant-at-Arms</option><option>Road Captain</option><option>Ambassador</option><option>Warden</option><option>Almoner</option><option>Quartermaster</option><option>Master of Ceremonies</option><option>Guardian of Membership</option>
        </select>
        <p id="silverNote" class="silver-note">Silver braided trim active</p>
      </div>
      <div class="field">
        <div class="meta"><label for="roadname">Roadname</label><span id="count">10/10</span></div>
        <input id="roadname" value="BUILDSMITH" maxlength="10" autocomplete="off" spellcheck="false">
        <p class="help">One English word, up to 10 letters.</p>
      </div>
      <div class="toggle"><div class="toggle-copy"><label>Honorary</label><small id="honoraryStatus">Visible</small></div><button class="switch on" id="honoraryToggle" type="button" role="switch" aria-checked="true" aria-label="Show Honorary patch"></button></div>
      <div class="field subfield" id="honoraryField"><label for="honoraryType">Honorary Type</label><select id="honoraryType"><option>Honorary</option><option>Most Honorary</option></select></div>
      <div class="toggle"><div class="toggle-copy"><label>Founder</label><small id="founderStatus">Visible</small></div><button class="switch on" id="founderToggle" type="button" role="switch" aria-checked="true" aria-label="Show Founder patch"></button></div>
      <div class="specs"><div><span>Flag</span><strong>11 × 6 cm</strong></div><div><span>Name patches</span><strong>11 × 3 cm</strong></div><div><span>Front emblem</span><strong>10 × 10 cm</strong></div><div><span>Vest size</span><strong>XL · 58 cm</strong></div></div>
    </aside>
    <main>
      <header><div><p class="eyebrow">LIVE PREVIEW</p><h2 id="heading">President</h2></div><div class="badge active" id="trimBadge">Silver trim</div></header>
      <div class="stage"><div class="vest">
        <img id="vestImage" src="vest-silver.png" alt="Widows Sons Chapter Hellas leather vest">
        <div class="size">SIZE<strong>XL</strong></div>
        <div class="patch rank" id="rankPatch">PRESIDENT</div>
        <div class="patch road" id="roadPatch">BUILDSMITH</div>
        <div class="patch honorary" id="honoraryPatch">HONORARY</div>
        <div class="patch founder" id="founderPatch">FOUNDER</div>
      </div></div>
    </main>
  </div>
  <script>
    const rank=document.getElementById('rank'),road=document.getElementById('roadname'),vest=document.getElementById('vestImage');
    const hp=document.getElementById('honoraryPatch'),fp=document.getElementById('founderPatch'),hf=document.getElementById('honoraryField');
    const ht=document.getElementById('honoraryToggle'),ft=document.getElementById('founderToggle'),type=document.getElementById('honoraryType');
    function setToggle(button,element,status,extra){const on=button.classList.toggle('on');button.setAttribute('aria-checked',on);element.classList.toggle('hidden',!on);document.getElementById(status).textContent=on?'Visible':'Hidden';if(extra)extra.classList.toggle('hidden',!on)}
    function updateRank(){const value=rank.value,silver=value==='President'||value==='Grand Master';document.getElementById('rankPatch').textContent=value.toUpperCase();document.getElementById('heading').textContent=value;vest.src=silver?'vest-silver.png':'vest-standard.png';document.getElementById('silverNote').classList.toggle('hidden',!silver);const badge=document.getElementById('trimBadge');badge.textContent=silver?'Silver trim':'Standard trim';badge.classList.toggle('active',silver);if(value==='Grand Master'){type.value='Most Honorary';hp.textContent='MOST HONORARY'}}
    rank.addEventListener('change',updateRank);
    road.addEventListener('input',()=>{road.value=road.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,10);document.getElementById('roadPatch').textContent=road.value||'ROAD NAME';document.getElementById('count').textContent=road.value.length+'/10'});
    type.addEventListener('change',()=>hp.textContent=type.value.toUpperCase());
    ht.addEventListener('click',()=>setToggle(ht,hp,'honoraryStatus',hf));
    ft.addEventListener('click',()=>setToggle(ft,fp,'founderStatus'));
  </script>
</body>
</html>
